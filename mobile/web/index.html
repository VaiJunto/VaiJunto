<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="VaiJunto - Caronas e vans universitarias.">
  <meta name="theme-color" content="#D91568">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="VaiJunto">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2"/>

  <title>VaiJunto</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (async () => {
      let controlledByFlutter = false;
      if ('serviceWorker' in navigator) {
        controlledByFlutter = navigator.serviceWorker.controller &&
            navigator.serviceWorker.controller.scriptURL
                .includes('/flutter_service_worker.js');
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          const flutterWorkers = registrations.filter((registration) => {
            const worker = registration.active ||
                registration.waiting || registration.installing;
            return worker && worker.scriptURL
                .includes('/flutter_service_worker.js');
          });

          await Promise.all(flutterWorkers.map((worker) => worker.unregister()));

          if ('caches' in window) {
            const cacheNames = await caches.keys();
            await Promise.all(
              cacheNames
                  .filter((name) => name.startsWith('flutter-'))
                  .map((name) => caches.delete(name)),
            );
          }
        } catch (_) {}

        if (controlledByFlutter &&
            sessionStorage.getItem('vj-sw-cleanup') !== 'done') {
          sessionStorage.setItem('vj-sw-cleanup', 'done');
          window.location.reload();
          return;
        }
        sessionStorage.removeItem('vj-sw-cleanup');

        navigator.serviceWorker.register('/firebase-messaging-sw.js', {
          scope: '/firebase-cloud-messaging-push-scope'
        }).catch(() => {});
      }

      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
