server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — qualquer rota desconhecida cai no index.html (Flutter Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html e o service worker nunca podem ser cacheados de forma
    # agressiva — são eles que decidem se existe uma versão nova do app.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }

    # Assets versionados pelo build (main.dart.js, canvaskit, fonts) podem ser
    # cacheados de forma longa — o nome/hash muda a cada build.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
