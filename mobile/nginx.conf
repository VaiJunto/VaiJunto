server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — qualquer rota desconhecida cai no index.html (Flutter Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos que apontam para o bundle atual nunca ficam presos no cache.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Assets internos versionados pelo manifesto do Flutter podem usar cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
