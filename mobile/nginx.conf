server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O PWA usa a mesma origem do site para a API. O navegador não precisa
    # fazer preflight CORS nem resolver um segundo domínio; o encaminhamento
    # acontece dentro da rede privada do Docker Compose.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # SPA fallback — qualquer rota desconhecida cai no index.html (Flutter Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos que apontam para o bundle atual nunca ficam presos no cache.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Os assets do Flutter Web NAO tem hash no nome do arquivo: fontes, icones e
    # imagens ficam sempre em /assets/... com o mesmo caminho a cada publicacao.
    # Cache longo aqui congelava o MaterialIcons-Regular.otf antigo no navegador
    # (o arquivo e um subset gerado por tree-shaking, so com os icones que
    # existiam naquele build) e todo icone novo aparecia como quadrado vazio.
    # Revalidar sempre: sao poucos KB e o 304 resolve quando nada mudou.
    location /assets/ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # O canvaskit vem versionado por diretorio, entao pode ficar em cache longo.
    location /canvaskit/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
