name: vaijunto
description: App de Transporte Universitário (VaiJunto) - Caronas e Vans.
publish_to: 'none'
version: 1.17.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.1
  google_maps_flutter: ^2.6.0
  geolocator: ^14.0.0
  stomp_dart_client: ^1.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  record: ^6.1.1
  path_provider: ^2.1.5
  video_player: ^2.9.2
  video_compress: ^3.1.3
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
