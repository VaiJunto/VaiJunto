version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: vaijunto_postgres
    environment:
      POSTGRES_DB: vaijunto_db
      POSTGRES_USER: vaijunto_user
      POSTGRES_PASSWORD: vaijunto_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaijunto_user -d vaijunto_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
