spring:
  # Desenvolvimento local: permite credenciais em ../.env.local, que fica fora
  # do repositório. Em produção, Docker injeta as mesmas chaves pelo .env da VPS.
  config:
    import: optional:file:../.env.local[.properties]
  application:
    name: vaijunto-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vaijunto_db}
    username: ${DB_USER:vaijunto_user}
    password: ${DB_PASS:vaijunto_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Fase de testes: SMTP do Gmail. MAIL_USERNAME precisa ser uma senha de app
  # (não a senha normal da conta) — gere em myaccount.google.com/apppasswords.
  # Gmail exige que o remetente seja a própria conta autenticada (ou um alias
  # configurado em "Enviar como"), por isso app.mail.from usa o mesmo valor.
  # Migrar para domínio próprio depois é só trocar host/port/username/password
  # por um provedor transacional (Resend, Brevo, MailerSend).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

app:
  firebase:
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
  mail:
    from: ${MAIL_FROM:VaiJunto <${MAIL_USERNAME:}>}
  verification:
    code-expiry-minutes: ${VERIFICATION_CODE_EXPIRY_MINUTES:15}
    resend-cooldown-seconds: ${VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
  cors:
    # Dev: localhost em qualquer porta (Flutter web dev server / flutter run -d chrome).
    # Prod: a VPS define CORS_ALLOWED_ORIGINS=https://vaijunto.app.br (ver DEPLOY.md).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  r2:
    endpoint: ${R2_ENDPOINT:}
    bucket: ${R2_BUCKET:}
    region: ${R2_REGION:auto}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    max-storage-gb: ${R2_MAX_STORAGE_GB:30}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
  # 3 dias — a sessão fica salva no device (não é reinício de app que desloga),
  # mas expira nesse intervalo e força login de novo com senha.
  expiration-ms: ${JWT_EXPIRATION_MS:259200000}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  health:
    # spring-boot-starter-mail auto-registra um health check que tenta
    # conectar no SMTP configurado. Sem MAIL_USERNAME/PASSWORD (ou se o Gmail
    # estiver fora do ar), esse único indicador derruba o /actuator/health
    # inteiro para 503 — mesmo com banco e app saudáveis. O envio de e-mail já
    # falha de forma isolada e logada (EmailService); não precisa também
    # travar o healthcheck de liveness do backend.
    mail:
      enabled: false
