name: Build & Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vaijunto-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push do Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/vaijunto/vaijunto-backend:latest
            ghcr.io/vaijunto/vaijunto-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push do Flutter Web (PWA)
        uses: docker/build-push-action@v6
        with:
          context: ./mobile
          push: true
          build-args: |
            API_BASE_URL=https://vaijunto.app.br/api/v1
            WS_BASE_URL=wss://api.vaijunto.app.br/ws-tracking
            BUILD_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/vaijunto/vaijunto-web:latest
            ghcr.io/vaijunto/vaijunto-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: [build-backend, build-web]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            /opt/apps/vaijunto/deploy.sh
